<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>barespec spec visual</title>
<script>
(function () {
  var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
  function apply() { document.documentElement.dataset.theme = mq && mq.matches ? 'dark' : 'light'; }
  apply();
  if (mq && mq.addEventListener) mq.addEventListener('change', apply);
})();
</script>
<style>
:root {
  color-scheme: light;
  --bs-font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --bs-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --bs-text: #1B1F24; --bs-text-2: #5B6470;
  --bs-bg: #FFFFFF; --bs-raised: #F5F6F8; --bs-line: #E2E5EA; --bs-line-strong: #C4CAD3;
  --bs-accent: #0E7490; --bs-accent-soft: #E0F2F7; --bs-accent-ink: #FFFFFF;
  --bs-violet-soft: #EEEBFB; --bs-grey-soft: #EEF0F2;
  --bs-ok: #15803D; --bs-ok-soft: #E7F6EC;
  --bs-warn: #A15C07; --bs-warn-soft: #FDF4E3;
  --bs-bad: #B42318; --bs-bad-soft: #FDECEA;
  --bs-mark: #FFF4C7; --bs-mark-ring: #C99A06;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px; --s16: 64px;
  --r1: 4px; --r2: 6px;
  --ease: 180ms ease;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bs-text: #E6E8EB; --bs-text-2: #9AA3AF;
  --bs-bg: #0F1115; --bs-raised: #181B22; --bs-line: #262A33; --bs-line-strong: #3A404C;
  --bs-accent: #5EC4D9; --bs-accent-soft: #123039; --bs-accent-ink: #0F1115;
  --bs-violet-soft: #221F36; --bs-grey-soft: #1E2128;
  --bs-ok: #4ADE80; --bs-ok-soft: #12291B;
  --bs-warn: #F2B544; --bs-warn-soft: #2E2410;
  --bs-bad: #F87171; --bs-bad-soft: #321616;
  --bs-mark: #2B2712; --bs-mark-ring: #D4A106;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; font: 15px/1.55 var(--bs-font); color: var(--bs-text); background: var(--bs-bg); }
:focus-visible { outline: 2px solid var(--bs-accent); outline-offset: 2px; }
h1, h2, h3 { font-weight: 600; line-height: 1.25; margin: 0; }
h1 { font-size: 1.875rem; overflow-wrap: anywhere; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
p + p { margin-top: var(--s3); }
ul { margin: 0; padding: 0; list-style: none; }
code { font: 0.86em var(--bs-mono); background: var(--bs-raised); border: 1px solid var(--bs-line); border-radius: var(--r1); padding: 0 4px; overflow-wrap: anywhere; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -9999px; top: 0; }
.skip:focus { left: var(--s4); top: var(--s4); z-index: 10; padding: var(--s2) var(--s3); background: var(--bs-bg); border-radius: var(--r1); }
.container { max-width: 1180px; margin: 0 auto; padding: var(--s8) var(--s6) var(--s16); }
.caption { font-size: 12.5px; color: var(--bs-text-2); }
.muted { color: var(--bs-text-2); }
.prose { max-width: 72ch; }

.hero { display: grid; gap: var(--s3); padding-bottom: var(--s6); border-bottom: 1px solid var(--bs-line); }
.eyebrow { font: 12.5px var(--bs-mono); color: var(--bs-accent); }
.title-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); }
.lede { font-size: 1.05rem; max-width: 72ch; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3) var(--s6); margin: var(--s2) 0 0; }
.meta > div { min-width: 0; }
.meta .wide { grid-column: 1 / -1; }
.meta dt { font-size: 12.5px; color: var(--bs-text-2); }
.meta dd { margin: 2px 0 0; font-size: 14px; }
.meta dd ul { display: grid; gap: 2px; }

.badge {
  display: inline-block; padding: 1px 8px; border-radius: var(--r1); font-size: 12.5px; font-weight: 600; white-space: nowrap;
  background: var(--bs-grey-soft); color: var(--bs-text-2);
}
.badge[data-tone="ok"] { background: var(--bs-ok-soft); color: var(--bs-ok); }
.badge[data-tone="accent"] { background: var(--bs-accent-soft); color: var(--bs-accent); }
.badge[data-tone="violet"] { background: var(--bs-violet-soft); color: var(--bs-text); }
.badge[data-tone="warn"] { background: var(--bs-warn-soft); color: var(--bs-warn); }

.acid {
  font: 500 12px/1.6 var(--bs-mono); padding: 0 6px; border-radius: var(--r1); border: 1px solid transparent;
  background: var(--bs-accent-soft); color: var(--bs-text); cursor: pointer; overflow-wrap: anywhere; text-align: left;
  transition: background-color var(--ease), border-color var(--ease);
}
.acid:hover { border-color: var(--bs-accent); }
.acid[aria-pressed="true"] { background: var(--bs-accent); color: var(--bs-accent-ink); }
.acid.is-unknown { background: var(--bs-warn-soft); color: var(--bs-warn); }
.chips { display: flex; flex-wrap: wrap; gap: var(--s1); }
.is-selected { background: var(--bs-mark) !important; }

.toolbar {
  position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s6);
  min-height: 48px; padding: var(--s2) 0; background: var(--bs-bg); border-bottom: 1px solid var(--bs-line); font-size: 14px;
}
.choice { display: inline-flex; align-items: center; gap: var(--s2); cursor: pointer; }
.choice input { width: 15px; height: 15px; margin: 0; accent-color: var(--bs-accent); }
.choice:has(input:disabled) { color: var(--bs-text-2); cursor: not-allowed; }
.choice[hidden] { display: none; }
.selection { margin-left: auto; display: inline-flex; align-items: center; gap: var(--s2); }
.selection[hidden] { display: none; }
.btn {
  font: 600 13px/1 var(--bs-font); height: 28px; padding: 0 10px; border-radius: var(--r1);
  border: 1px solid var(--bs-line-strong); background: var(--bs-bg); color: var(--bs-text); cursor: pointer;
  transition: background-color var(--ease);
}
.btn:hover { background: var(--bs-raised); }

.alerts { display: grid; gap: var(--s3); margin-top: var(--s6); }
.alert { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s4); border-radius: var(--r2); border: 1px solid; font-size: 14px; }
.alert > svg { flex: none; width: 18px; height: 18px; margin-top: 2px; }
.alert > div { min-width: 0; }
.alert[data-tone="info"] { background: var(--bs-accent-soft); border-color: var(--bs-accent); }
.alert[data-tone="info"] > svg { color: var(--bs-accent); }
.alert[data-tone="warn"] { background: var(--bs-warn-soft); border-color: var(--bs-warn); }
.alert[data-tone="warn"] > svg { color: var(--bs-warn); }
.alert[data-tone="bad"] { background: var(--bs-bad-soft); border-color: var(--bs-bad); }
.alert[data-tone="bad"] > svg { color: var(--bs-bad); }
.alert ul { display: grid; gap: var(--s1); margin-top: var(--s2); }
.alert li { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }

.section { margin-top: var(--s8); padding-top: var(--s6); border-top: 1px solid var(--bs-line); }
.section:first-of-type { border-top: 0; }
.section > summary { display: flex; align-items: center; gap: var(--s2); cursor: pointer; list-style: none; padding-bottom: var(--s4); }
.section > summary::-webkit-details-marker { display: none; }
.section > summary > svg { width: 18px; height: 18px; flex: none; color: var(--bs-text-2); transition: transform var(--ease); }
.section:not([open]) > summary > svg { transform: rotate(-90deg); }
.section-body { display: grid; gap: var(--s8); }

.group { display: grid; gap: 2px; }
.group-key { font: 12.5px var(--bs-mono); color: var(--bs-text-2); }
.reqs { display: grid; margin-top: var(--s3); border: 1px solid var(--bs-line); border-radius: var(--r2); overflow: hidden; }
.req {
  display: grid; grid-template-columns: 13rem minmax(0, 1fr) auto; gap: var(--s3); align-items: start;
  padding: var(--s2) var(--s3); font-size: 14px;
}
.req + .req { border-top: 1px solid var(--bs-line); }
.req > .acid { justify-self: start; }
.req.sub { padding-left: var(--s8); }
.req-text { min-width: 0; }
.req-text .caption { margin-top: 2px; }

.table-wrap { border: 1px solid var(--bs-line); border-radius: var(--r2); overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { background: var(--bs-raised); color: var(--bs-text-2); font-size: 12.5px; font-weight: 600; text-align: left; padding: var(--s2) var(--s3); white-space: nowrap; border-bottom: 1px solid var(--bs-line); }
td { padding: var(--s2) var(--s3); vertical-align: top; }
tr + tr td { border-top: 1px solid var(--bs-line); }
td.nowrap { white-space: nowrap; }
.task-refs { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); }
.task-ref { display: inline-flex; align-items: center; gap: 3px; font: 12px var(--bs-mono); }
.task-ref svg { width: 13px; height: 13px; }
.state-done { color: var(--bs-ok); }
.state-open { color: var(--bs-text-2); }

.plan-intro { display: grid; gap: var(--s4); max-width: 72ch; font-size: 14px; }
.plan-intro .h-sm { font-size: 14px; margin-bottom: var(--s1); }
.bullets { list-style: disc; padding-left: var(--s6); display: grid; gap: 2px; }
.plan-section { display: grid; gap: var(--s2); }
.plan-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s6); }
.progress { display: inline-flex; align-items: center; gap: var(--s2); font-size: 13px; color: var(--bs-text-2); font-variant-numeric: tabular-nums; }
.bar { width: 140px; height: 8px; border-radius: var(--r1); background: var(--bs-grey-soft); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--bs-accent); }
.tasks { display: grid; border: 1px solid var(--bs-line); border-radius: var(--r2); overflow: hidden; }
.task { display: grid; grid-template-columns: 18px 2.75rem minmax(0, 1fr); gap: var(--s3); align-items: start; padding: var(--s2) var(--s3); font-size: 14px; }
.task + .task { border-top: 1px solid var(--bs-line); }
.task.depth-1 { padding-left: var(--s8); }
.task > svg { width: 18px; height: 18px; margin-top: 1px; }
.task-id { font-family: var(--bs-mono); font-size: 13px; color: var(--bs-text-2); padding-top: 1px; }
.task-body { display: grid; gap: var(--s1); min-width: 0; }
.task-tags { display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; }
.only-open .task[data-done="true"] { display: none; }
.only-uncovered [data-covered="true"] { display: none; }
.focus [data-acids]:not(.is-selected):not(.node), .focus .is-empty, .focus .alerts, .focus .plan-intro, .focus #scope .bullets { display: none; }
.focus .node:not(.is-selected) { opacity: 0.3; }

.flow {
  position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 230px);
  column-gap: var(--s12); overflow-x: auto; padding: var(--s2); background: var(--bs-raised); border-radius: var(--r2);
}
.flow-stage { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--s4); }
.edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.edges path.edge { fill: none; stroke: var(--bs-line-strong); stroke-width: 1.5; }
.edges marker path { fill: var(--bs-line-strong); }
.edges text { font-size: 11px; fill: var(--bs-text-2); paint-order: stroke; stroke: var(--bs-raised); stroke-width: 4px; stroke-linejoin: round; }
.node {
  display: grid; gap: var(--s1); padding: var(--s2) var(--s3); border: 1px dashed var(--bs-line-strong);
  border-radius: var(--r2); background: var(--node-bg); font-size: 13.5px; --node-bg: var(--bs-bg);
}
.node[data-kind="entry"] { --node-bg: var(--bs-accent-soft); }
.node[data-kind="external"] { --node-bg: var(--bs-violet-soft); }
.node[data-kind="exit"] { --node-bg: var(--bs-grey-soft); }
.node .acid:not([aria-pressed="true"]):not(.is-unknown) { background: var(--bs-bg); border-color: var(--bs-line); }
.node.is-selected { background: var(--node-bg) !important; outline: 2px solid var(--bs-mark-ring); outline-offset: 1px; }

@media (max-width: 640px) {
  .container { padding: var(--s6) var(--s4) var(--s12); }
  .req { grid-template-columns: minmax(0, 1fr); }
  .req.sub { padding-left: var(--s6); }
  .task.depth-1 { padding-left: var(--s4); }
  .selection { margin-left: 0; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main" class="container"></main>
<script type="application/json" id="barespec-data">__BARESPEC_DATA__</script>
<script>
(() => {
  'use strict';

  const ICONS = {
    done: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    open: '<circle cx="12" cy="12" r="10"/>',
    optional: '<circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/>',
    checkpoint: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
    warning: '<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 11v5"/><path d="M12 8h.01"/>',
    chevron: '<path d="m6 9 6 6 6-6"/>'
  };
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const main = document.getElementById('main');

  // Every piece of spec text goes through text nodes, never innerHTML.
  const append = (el, child) => {
    if (child == null || child === false) return;
    if (Array.isArray(child)) child.forEach(c => append(el, c));
    else el.append(child instanceof Node ? child : String(child));
  };
  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    append(el, children);
    return el;
  };
  const svgEl = (tag, attrs) => {
    const el = document.createElementNS(SVG_NS, tag);
    Object.entries(attrs || {}).forEach(([k, v]) => el.setAttribute(k, v));
    return el;
  };
  const icon = (name, cls) => {
    const el = svgEl('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' });
    if (cls) el.setAttribute('class', cls);
    el.innerHTML = ICONS[name];
    return el;
  };
  const inline = text => String(text ?? '').split(/(`[^`\n]+`)/).map(part =>
    part.length > 2 && part.startsWith('`') && part.endsWith('`') ? h('code', null, part.slice(1, -1)) : part);
  const rich = (text, cls) => String(text ?? '').split(/\n\s*\n/).filter(p => p.trim()).map(p => h('p', { class: cls }, inline(p)));
  const truncate = (s, n = 60) => (s = String(s ?? '')).length > n ? s.slice(0, n - 1) + '…' : s;
  const badge = (tone, text) => h('span', { class: 'badge', 'data-tone': tone || null }, text);
  const alertBox = (tone, ...content) => h('div', { class: 'alert', 'data-tone': tone }, icon(tone === 'info' ? 'info' : 'warning'), h('div', null, content));

  let data;
  try {
    data = JSON.parse(document.getElementById('barespec-data').textContent);
  } catch (err) {
    main.append(alertBox('bad', h('p', null, h('strong', null, 'This file has no valid spec data. '), 'Re-run /spec-visualize to regenerate it. (' + err.message + ')')));
    return;
  }

  // ── Model ─────────────────────────────────────────────────────────────
  const spec = data.spec || {};
  const plan = data.plan || null;
  const specPrefix = (spec.name || '') + '.';
  const norm = a => { a = String(a).trim(); return spec.name && a.startsWith(specPrefix) ? a.slice(specPrefix.length) : a; };

  const groups = (data.groups || []).map(g => ({ ...g, kind: g.kind === 'constraint' ? 'constraint' : 'component' }));
  const reqs = [];
  const reqByAcid = new Map();
  groups.forEach(g => (g.requirements || []).forEach(r => {
    const id = String(r.id);
    const sub = /^(\d+)-(\d+)$/.exec(id);
    const item = { acid: g.key + '.' + id, group: g, id, text: r.text, note: r.note, parent: sub ? g.key + '.' + sub[1] : null, tasks: [] };
    reqs.push(item);
    reqByAcid.set(item.acid, item);
  }));

  const CHECKPOINT = /^checkpoint\b/i;
  const sections = plan ? (plan.sections || []).map(s => ({
    title: s.title,
    tasks: (s.tasks || []).map(t => ({
      ...t, id: t.id ? String(t.id) : '', acids: (t.acids || []).map(norm), files: t.files || [],
      checkpoint: CHECKPOINT.test(s.title || '') || CHECKPOINT.test(t.text || '')
    }))
  })) : [];
  const tasks = sections.flatMap(s => s.tasks);
  tasks.forEach(t => t.acids.forEach(a => reqByAcid.get(a)?.tasks.push(t)));

  const count = list => {
    const required = list.filter(t => !t.optional);
    return { done: required.filter(t => t.done).length, total: required.length, optional: list.length - required.length };
  };
  const totals = count(tasks);

  const flow = data.flow && Array.isArray(data.flow.nodes) && data.flow.nodes.length ? data.flow : null;
  const flowNodes = flow ? flow.nodes.map(n => ({ ...n, acids: (n.acids || []).map(norm), stage: Number(n.stage) || 0 })) : [];

  const warnings = [];
  const taskLabel = t => t.id ? 'Task ' + t.id : 'Task “' + truncate(t.text, 40) + '”';
  tasks.forEach(t => {
    t.acids.filter(a => !reqByAcid.has(a)).forEach(a => warnings.push([taskLabel(t) + ' cites ' + a + ', which is not in spec.yaml.']));
    if (!t.checkpoint && !t.acids.length) warnings.push([taskLabel(t) + ' does not cite any requirement.']);
  });
  reqs.filter(r => r.parent && !reqByAcid.has(r.parent)).forEach(r => warnings.push([r.acid + ' is a sub-requirement, but ' + r.parent + ' does not exist.', r.acid]));
  flowNodes.forEach(n => {
    if (!n.acids.length) warnings.push(['Flow step “' + truncate(n.label, 40) + '” does not cite any requirement.']);
    n.acids.filter(a => !reqByAcid.has(a)).forEach(a => warnings.push(['Flow step “' + truncate(n.label, 40) + '” cites ' + a + ', which is not in spec.yaml.']));
  });

  const files = new Map();
  const fileEntry = p => files.get(p) || files.set(p, { path: p, tasks: [], notes: false }).get(p);
  tasks.forEach(t => t.files.forEach(f => fileEntry(f).tasks.push(t)));
  (data.noteFiles || []).forEach(f => { fileEntry(f).notes = true; });

  // ── Selection ─────────────────────────────────────────────────────────
  let selected = null;
  const onlySelected = h('input', { type: 'checkbox', onchange: () => applyFocus() });
  const onlySelectedToggle = h('label', { class: 'choice', hidden: true }, onlySelected, 'Only selected');
  const selectionLabel = h('span');
  const selectionBox = h('span', { class: 'selection', hidden: true, 'aria-live': 'polite' },
    selectionLabel, h('button', { type: 'button', class: 'btn', onclick: () => select(null) }, 'Clear'));
  function applyFocus() {
    const on = !!selected && onlySelected.checked;
    document.body.classList.toggle('focus', on);
    document.querySelectorAll('.group, .plan-section, .section').forEach(el => {
      const empty = on && !el.querySelector('.is-selected');
      el.classList.toggle('is-empty', empty);
      if (on && !empty && el.tagName === 'DETAILS') el.open = true;
    });
  }
  function select(acid) {
    selected = acid && acid !== selected ? acid : null;
    document.querySelectorAll('[data-acids]').forEach(el =>
      el.classList.toggle('is-selected', !!selected && el.dataset.acids.split(' ').includes(selected)));
    document.querySelectorAll('.acid').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.acid === selected)));
    selectionBox.hidden = !selected;
    selectionLabel.textContent = selected ? 'Highlighting ' + selected : '';
    onlySelectedToggle.hidden = !selected;
    if (!selected) onlySelected.checked = false;
    applyFocus();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && selected) select(null); });

  const chip = acid => h('button', {
    type: 'button', class: 'acid' + (reqByAcid.has(acid) ? '' : ' is-unknown'), 'data-acid': acid, 'aria-pressed': 'false',
    title: reqByAcid.get(acid)?.text || 'Not in spec.yaml', onclick: () => select(acid)
  }, acid);
  const taskRef = t => h('span', { class: 'task-ref', title: truncate(t.text, 120) },
    icon(t.done ? 'done' : 'open', t.done ? 'state-done' : 'state-open'), t.id || '–', h('span', { class: 'sr-only' }, t.done ? ' (done)' : ' (open)'));
  const coverage = r => !plan ? badge('', 'Not planned') : r.tasks.length ? badge('ok', r.tasks.length === 1 ? '1 task' : r.tasks.length + ' tasks') : badge('warn', 'No task');
  const progress = c => h('span', { class: 'progress' },
    h('span', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(c.total), 'aria-valuenow': String(c.done), 'aria-label': 'Tasks done' },
      h('span', { style: 'width:' + (c.total ? Math.round(c.done / c.total * 100) : 0) + '%' })),
    c.done + '/' + c.total + (c.optional ? ' (+' + c.optional + ' optional)' : ''));

  const section = (id, title, open, extra, ...content) => h('details', { class: 'section', id, open },
    h('summary', null, icon('chevron'), h('h2', null, title), extra),
    h('div', { class: 'section-body' }, content));

  // ── Views ─────────────────────────────────────────────────────────────
  const formatDate = s => { const d = new Date(s); return s && !isNaN(d) && String(s).includes('T') ? d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : (s || 'unknown'); };
  const STATUS_TONE = { draft: '', ready: 'accent', 'in-progress': 'violet', done: 'ok' };
  const metaItem = (label, value, wide) => h('div', { class: wide ? 'wide' : null }, h('dt', null, label), h('dd', null, value));
  const listOrNone = items => items && items.length ? h('ul', null, items.map(i => h('li', null, inline(i)))) : 'None';

  function renderHeader() {
    return h('header', { class: 'hero' },
      h('p', { class: 'eyebrow' }, 'barespec / specs / ' + (spec.name || '')),
      h('div', { class: 'title-row' },
        h('h1', null, spec.name || 'Untitled spec'),
        badge(STATUS_TONE[spec.status] ?? '', spec.status || 'unknown status')),
      spec.description ? h('p', { class: 'lede' }, inline(spec.description)) : null,
      h('dl', { class: 'meta' },
        metaItem('Version', spec.version || '–'),
        metaItem('Created', spec.created || '–'),
        metaItem('Updated', spec.updated || '–'),
        metaItem('Tasks done', plan ? totals.done + '/' + totals.total + (totals.optional ? ' (+' + totals.optional + ' optional)' : '') : 'No plan yet'),
        metaItem('Requires', listOrNone(spec.requires)),
        metaItem('Prerequisites', listOrNone(spec.prerequisites), true)),
      h('p', { class: 'caption' },
        'Snapshot of v' + (spec.version || '–') + ' (spec updated ' + (spec.updated || '–') + '), generated ' + formatDate(data.generatedAt) +
        '. Re-run ', h('code', null, '/spec-visualize ' + (spec.name || '')), ' after editing spec.yaml or plan.md.'));
  }

  function renderToolbar() {
    const toggle = (cls, label) => h('label', { class: 'choice' },
      h('input', { type: 'checkbox', disabled: !plan, onchange: e => document.body.classList.toggle(cls, e.target.checked) }), label);
    return h('div', { class: 'toolbar', role: 'region', 'aria-label': 'Filters' },
      toggle('only-uncovered', 'Only uncovered requirements'),
      toggle('only-open', 'Only open tasks'),
      onlySelectedToggle,
      selectionBox);
  }

  function renderAlerts() {
    const box = h('div', { class: 'alerts' });
    if (!plan) box.append(alertBox('info', h('p', null, h('strong', null, 'No plan yet. '), 'Run ', h('code', null, '/spec-plan ' + (spec.name || '')), ' to generate one. Until then, the traceability and plan sections stay empty.')));
    if (warnings.length) box.append(alertBox('warn',
      h('p', null, h('strong', null, warnings.length === 1 ? '1 inconsistency between spec and plan' : warnings.length + ' inconsistencies between spec and plan')),
      h('ul', null, warnings.map(([text, acid]) => h('li', null, text, acid ? chip(acid) : null)))));
    return box.childElementCount ? box : null;
  }

  const reqRow = r => h('li', { class: 'req' + (r.parent ? ' sub' : ''), 'data-acids': r.acid, 'data-covered': String(r.tasks.length > 0) },
    chip(r.acid),
    h('div', { class: 'req-text' }, inline(r.text), r.note ? h('p', { class: 'caption' }, inline(r.note)) : null),
    coverage(r));

  function renderRequirements() {
    if (!reqs.length) return h('p', { class: 'muted' }, 'This spec has no requirements yet.');
    return groups.map(g => h('div', { class: 'group' },
      h('p', { class: 'group-key' }, (g.kind === 'constraint' ? 'constraint' : 'component') + ' · ' + g.key),
      h('h3', null, g.name || g.key),
      g.description ? h('p', { class: 'muted prose' }, inline(g.description)) : null,
      h('ul', { class: 'reqs' }, reqs.filter(r => r.group === g).map(reqRow))));
  }

  function renderMatrix() {
    if (!plan) return h('p', { class: 'muted' }, 'No plan yet, so no task covers any requirement.');
    return h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, ['Requirement', 'Text', 'Tasks', 'Coverage'].map(c => h('th', { scope: 'col' }, c)))),
      h('tbody', null, reqs.map(r => h('tr', { 'data-acids': r.acid, 'data-covered': String(r.tasks.length > 0) },
        h('td', { class: 'nowrap' }, chip(r.acid)),
        h('td', null, truncate(r.text, 140)),
        h('td', null, r.tasks.length ? h('div', { class: 'task-refs' }, r.tasks.map(taskRef)) : h('span', { class: 'muted' }, '–')),
        h('td', { class: 'nowrap' }, coverage(r)))))));
  }

  function taskRow(t, ids) {
    const parentId = t.id.includes('.') ? t.id.split('.').slice(0, -1).join('.') : '';
    const state = t.optional && !t.done ? 'optional' : t.done ? 'done' : 'open';
    return h('li', { class: 'task' + (parentId && ids.has(parentId) ? ' depth-1' : ''), 'data-acids': t.acids.join(' '), 'data-done': String(!!t.done) },
      icon(t.checkpoint ? 'checkpoint' : state, t.done ? 'state-done' : 'state-open'),
      h('span', { class: 'task-id' }, t.id || '–'),
      h('div', { class: 'task-body' },
        h('div', null, h('span', { class: 'sr-only' }, (t.done ? 'Done' : 'Open') + (t.checkpoint ? ' checkpoint' : '') + ': '), inline(t.text)),
        t.checkpoint || t.optional || t.acids.length ? h('div', { class: 'task-tags' },
          t.checkpoint ? badge('', 'checkpoint') : null,
          t.optional ? badge('violet', 'optional') : null,
          t.acids.map(chip)) : null));
  }

  function renderPlan() {
    if (!plan) return h('p', { class: 'muted' }, 'No plan yet.');
    const block = (title, items) => items && items.length ? h('div', null, h('h3', { class: 'h-sm' }, title), h('ul', { class: 'bullets' }, items.map(i => h('li', null, inline(i))))) : null;
    const intro = h('div', { class: 'plan-intro' },
      plan.approach ? h('div', null, rich(plan.approach)) : null,
      block('Acceptance criteria', plan.acceptanceCriteria),
      block('Verification', plan.verification),
      plan.scope ? h('p', { class: 'muted' }, 'Estimated scope: ', inline(plan.scope)) : null);
    return [intro.childElementCount ? intro : null, ...sections.map(s => {
      const ids = new Set(s.tasks.map(t => t.id).filter(Boolean));
      return h('div', { class: 'plan-section' },
        h('div', { class: 'plan-head' }, h('h3', null, inline(s.title)), s.tasks.length ? progress(count(s.tasks)) : null),
        h('ul', { class: 'tasks' }, s.tasks.map(t => taskRow(t, ids))));
    })];
  }

  const KIND_LABEL = { entry: 'entry point', step: 'step', external: 'external call', exit: 'early exit' };

  function renderFlow() {
    if (!flow) return h('p', { class: 'muted' }, 'No flow inferred from this spec.');
    const wrap = h('div', { class: 'flow' });
    const svg = svgEl('svg', { class: 'edges', 'aria-hidden': 'true' });
    wrap.append(svg);
    const byId = new Map();
    [...new Set(flowNodes.map(n => n.stage))].sort((a, b) => a - b).forEach(stage => {
      wrap.append(h('div', { class: 'flow-stage' }, flowNodes.filter(n => n.stage === stage).map(n => {
        const el = h('div', { class: 'node', 'data-kind': KIND_LABEL[n.kind] ? n.kind : 'step', 'data-acids': n.acids.join(' ') },
          h('span', { class: 'caption' }, KIND_LABEL[n.kind] || 'step'),
          h('p', null, inline(n.label)),
          n.acids.length ? h('div', { class: 'chips' }, n.acids.map(chip)) : null);
        byId.set(n.id, el);
        return el;
      })));
    });
    const edges = (flow.edges || []).filter(e => byId.has(e.from) && byId.has(e.to));

    const draw = () => {
      svg.setAttribute('width', '0');
      svg.setAttribute('height', '0');
      const base = wrap.getBoundingClientRect();
      if (!base.width) return;
      const W = wrap.scrollWidth, H = wrap.scrollHeight;
      svg.setAttribute('width', W);
      svg.setAttribute('height', H);
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      const box = el => {
        const r = el.getBoundingClientRect();
        const l = r.left - base.left + wrap.scrollLeft, t = r.top - base.top + wrap.scrollTop;
        return { l, t, r: l + r.width, b: t + r.height, cx: l + r.width / 2, cy: t + r.height / 2 };
      };
      const marker = svgEl('marker', { id: 'bs-arrow', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' });
      marker.append(svgEl('path', { d: 'M0 0L10 5L0 10z' }));
      const defs = svgEl('defs');
      defs.append(marker);
      svg.replaceChildren(defs);
      edges.forEach(e => {
        const a = box(byId.get(e.from)), b = box(byId.get(e.to));
        let d;
        if (b.l >= a.r) {
          const dx = Math.max(24, (b.l - a.r) / 2);
          d = `M${a.r} ${a.cy} C${a.r + dx} ${a.cy} ${b.l - dx} ${b.cy} ${b.l} ${b.cy}`;
        } else {
          const down = b.t >= a.b, y1 = down ? a.b : a.t, y2 = down ? b.t : b.b, dy = (y2 - y1) / 2;
          d = `M${a.cx} ${y1} C${a.cx} ${y1 + dy} ${b.cx} ${y2 - dy} ${b.cx} ${y2}`;
        }
        const path = svgEl('path', { class: 'edge', d, 'marker-end': 'url(#bs-arrow)' });
        svg.append(path);
        if (e.label) {
          const mid = path.getPointAtLength(path.getTotalLength() / 2);
          const text = svgEl('text', { x: mid.x, y: mid.y - 6, 'text-anchor': 'middle' });
          text.textContent = e.label;
          svg.append(text);
        }
      });
    };
    new ResizeObserver(draw).observe(wrap);
    return [h('p', { class: 'caption prose' }, 'Derived by the agent from spec.yaml, so it is not part of the contract. Each step cites the requirements it is drawn from.'), wrap];
  }

  function renderFiles() {
    if (!files.size) return h('p', { class: 'muted' }, 'No file paths are cited in the plan or notes.');
    const rows = [...files.values()].sort((a, b) => a.path.localeCompare(b.path));
    return h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, ['File', 'Tasks', 'In notes'].map(c => h('th', { scope: 'col' }, c)))),
      h('tbody', null, rows.map(f => h('tr', { 'data-acids': [...new Set(f.tasks.flatMap(t => t.acids))].join(' ') },
        h('td', null, h('code', null, f.path)),
        h('td', null, f.tasks.length ? h('div', { class: 'task-refs' }, f.tasks.map(taskRef)) : h('span', { class: 'muted' }, '–')),
        h('td', { class: 'nowrap' }, f.notes ? 'yes' : '–'))))));
  }

  function renderScope() {
    const nonGoals = data.nonGoals || [];
    const questions = data.openQuestions || [];
    if (!nonGoals.length && !questions.length) return h('p', { class: 'muted' }, 'No non-goals recorded.');
    return [
      nonGoals.length ? h('ul', { class: 'bullets prose' }, nonGoals.map(g => h('li', null, inline(g)))) : null,
      questions.length ? h('div', null, h('h3', null, 'Open questions'), h('p', { class: 'caption' }, 'Deferred external blockers.'),
        h('div', { class: 'table-wrap', style: 'margin-top: var(--s3)' }, h('table', null,
          h('thead', null, h('tr', null, ['Question', 'Blocked by', 'Affects', 'Deferred on'].map(c => h('th', { scope: 'col' }, c)))),
          h('tbody', null, questions.map(q => {
            const acid = q.affects && q.affects !== 'general' ? norm(q.affects) : null;
            return h('tr', { 'data-acids': acid || '' },
              h('td', null, inline(q.question)), h('td', null, inline(q.blockedBy)),
              h('td', { class: 'nowrap' }, acid ? chip(acid) : (q.affects || '–')), h('td', { class: 'nowrap' }, q.deferredOn || '–'));
          }))))) : null
    ];
  }

  function renderNotes() {
    const block = (title, text) => text ? h('div', { class: 'prose' }, h('h3', { style: 'margin-bottom: var(--s2)' }, title), rich(text)) : null;
    const out = [block('Technical notes', data.technicalNotes), block('Development notes', data.developmentNotes)].filter(Boolean);
    return out.length ? out : h('p', { class: 'muted' }, 'No notes recorded.');
  }

  document.title = (spec.name || 'Spec') + ' · barespec';
  main.append(
    renderHeader(),
    renderToolbar(),
    renderAlerts() || '',
    section('requirements', 'Requirements', true, null, renderRequirements()),
    section('traceability', 'Traceability', true, null, renderMatrix()),
    section('plan', 'Plan', true, null, renderPlan()),
    section('flow', 'Flow', true, badge('violet', 'inferred'), renderFlow()),
    section('files', 'Files', true, null, renderFiles()),
    section('scope', 'Non-goals', true, null, renderScope()),
    section('notes', 'Notes', false, null, renderNotes())
  );
})();
</script>
</body>
</html>
