<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-title workflow-desc">
      <title id="workflow-title">BareSpec workflow</title>
      <desc id="workflow-desc">Process diagram showing context, spec, plan and implement steps in sequence, with feedback loops to context and to the next spec, and optional read-only visualize and code review steps.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Hooks zone -->
      <rect x="40" y="20" width="920" height="372" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="64" y="33" fill="#2d3142" fill-opacity="0.50" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PRE / POST HOOKS ON EVERY STEP · /INIT-CONFIG → BARESPEC.CONFIG.YML</text>

      <!-- Feedback: context update (outer loop) -->
      <path d="M896,152 V92 Q896,84 888,84 H148 Q140,84 140,92 V152" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="462" y="66" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="518" y="75" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPDATES CONTEXT.MD</text>

      <!-- Feedback: next feature (inner loop) -->
      <path d="M800,152 V128 Q800,120 792,120 H348 Q340,120 340,128 V152" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="528" y="102" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="570" y="111" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT FEATURE</text>

      <!-- Main flow -->
      <path d="M240,184 H296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M472,184 H528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M704,184 H760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Optional: visualize reads spec + plan -->
      <path d="M384,216 V320 Q384,328 392,328 H420" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M616,216 V320 Q616,328 608,328 H580" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Optional: review reads implemented diff -->
      <path d="M848,216 V296" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- 01 /init-context -->
      <rect x="64" y="152" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="152" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="158" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="86" y="167" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="152" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/init-context</text>
      <text x="152" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">context.md</text>

      <!-- 02 /spec-create (focal) -->
      <rect x="296" y="152" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="152" width="176" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="304" y="158" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="318" y="167" fill="#eb6c36" fill-opacity="0.90" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="384" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/spec-create</text>
      <text x="384" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spec.yaml · draft</text>

      <!-- 03 /spec-plan -->
      <rect x="528" y="152" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="152" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="158" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="550" y="167" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="616" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/spec-plan</text>
      <text x="616" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plan.md · ready</text>

      <!-- 04 /spec-implement -->
      <rect x="760" y="152" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="152" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="768" y="158" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="782" y="167" fill="#2d3142" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="848" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/spec-implement</text>
      <text x="848" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in-progress → done</text>

      <!-- OPT /spec-visualize -->
      <rect x="420" y="296" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="296" width="160" height="64" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="428" y="302" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="442" y="311" fill="#2d3142" fill-opacity="0.70" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPT</text>
      <text x="500" y="334" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/spec-visualize</text>
      <text x="500" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">visual.html · read-only</text>

      <!-- OPT /spec-code-review -->
      <rect x="760" y="296" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="296" width="176" height="64" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="768" y="302" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="782" y="311" fill="#2d3142" fill-opacity="0.70" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPT</text>
      <text x="848" y="334" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/spec-code-review</text>
      <text x="848" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">report only · read-only</text>

      <!-- Legend -->
      <line x1="40" y1="408" x2="960" y2="408" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="426" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="148" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Workflow step</text>

      <rect x="270" y="426" width="20" height="12" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="298" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Spec contract</text>

      <rect x="420" y="426" width="20" height="12" rx="3" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="448" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Optional skill</text>

      <line x1="590" y1="432" x2="614" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="622" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Advances workflow</text>

      <line x1="770" y1="432" x2="794" y2="432" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="802" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Feedback / read-only</text>
    </svg>
