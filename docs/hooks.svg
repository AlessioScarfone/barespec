<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hooks-title hooks-desc">
  <title id="hooks-title">BareSpec pre and post hooks</title>
  <desc id="hooks-desc">Diagram showing optional pre-hooks running before a BareSpec skill and optional post-hooks running after it, both read from the barespec.config.yml file written by init-config.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Config reads -->
  <path d="M380,80 H212 Q204,80 204,88 V200" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="244" y="62" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="296" y="71" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOOKS.&lt;STEP&gt;.PRE</text>

  <path d="M620,80 H788 Q796,80 796,88 V200" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="648" y="62" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="704" y="71" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOOKS.&lt;STEP&gt;.POST</text>

  <!-- Main flow -->
  <path d="M324,232 H380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M620,232 H676" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Hook config (store) -->
  <rect x="380" y="48" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="380" y="48" width="240" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <rect x="388" y="54" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="402" y="63" fill="#4f5d75" fill-opacity="0.80" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
  <text x="500" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hook config</text>
  <text x="500" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">barespec.config.yml · /init-config</text>

  <!-- Pre-hooks -->
  <rect x="84" y="200" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="84" y="200" width="240" height="64" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="92" y="206" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
  <text x="106" y="215" fill="#2d3142" fill-opacity="0.70" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRE</text>
  <text x="204" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pre-hooks</text>
  <text x="204" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">e.g. check git status</text>

  <!-- Skill workflow (focal) -->
  <rect x="380" y="200" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="380" y="200" width="240" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
  <rect x="388" y="206" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="402" y="215" fill="#eb6c36" fill-opacity="0.90" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="500" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Main workflow</text>
  <text x="500" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">any BareSpec skill</text>

  <!-- Post-hooks -->
  <rect x="676" y="200" width="240" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="676" y="200" width="240" height="64" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="684" y="206" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
  <text x="698" y="215" fill="#2d3142" fill-opacity="0.70" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST</text>
  <text x="796" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Post-hooks</text>
  <text x="796" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">e.g. run lint and tests</text>

  <!-- Legend -->
  <line x1="40" y1="308" x2="960" y2="308" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="40" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <rect x="120" y="326" width="20" height="12" rx="3" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="148" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Config file</text>

  <rect x="260" y="326" width="20" height="12" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
  <text x="288" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Skill step</text>

  <rect x="390" y="326" width="20" height="12" rx="3" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="418" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Optional hook</text>

  <line x1="550" y1="332" x2="574" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="582" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Runs in order</text>

  <line x1="730" y1="332" x2="754" y2="332" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="762" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Reads from config</text>
</svg>
